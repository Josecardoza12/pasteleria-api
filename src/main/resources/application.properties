spring.application.name=pasteleria-api

# ---------- Base de datos MySQL (XAMPP, puerto 3306) ----------
# La base pasteleria_db se crea sola al primer arranque
spring.datasource.url=jdbc:mysql://localhost:3306/pasteleria_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
# Crea y actualiza las tablas a partir de las clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# En desarrollo usa este valor; en producción se pasa por la variable JWT_SECRET
jwt.secret=${JWT_SECRET:pasteleria-mil-sabores-clave-de-desarrollo-2026-no-usar-en-produccion}
jwt.access-minutos=15
jwt.refresh-dias=7

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html